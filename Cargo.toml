[package]
name = "git-vet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
gix = { version = "0.84.0", features = ["blob-diff", "comfort", "max-performance-safe", "revision", "sha1", "tree-editor"], default-features = false }
gix-config = "0.57.0"
ignore = "0.4.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
